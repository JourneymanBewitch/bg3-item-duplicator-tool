<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="0.5" stop-color="#2b1650"/>
      <stop offset="1" stop-color="#150a24"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd479" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4de3d1" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4de3d1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#d89b2c"/>
    </linearGradient>
    <linearGradient id="gem2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe9dd"/>
      <stop offset="1" stop-color="#2a9d92"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c877"/>
      <stop offset="1" stop-color="#a9781f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="150" cy="80" r="220" fill="url(#glowGold)" opacity="0.25"/>
  <circle cx="1060" cy="300" r="240" fill="url(#glowTeal)" opacity="0.25"/>

  <!-- faint arcane grid lines -->
  <g stroke="#5a3f8a" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Left magic circle with rune-like polygon (source item) -->
  <g transform="translate(150,190)">
    <circle r="95" fill="none" stroke="#ffd479" stroke-width="1.5" opacity="0.55"/>
    <circle r="78" fill="none" stroke="#ffd479" stroke-width="1" opacity="0.35"/>
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="none" stroke="#e8c877" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="none" stroke="#ffd479" stroke-width="1" opacity="0.4"/>
    <!-- gem item -->
    <polygon points="0,-30 22,-8 14,26 -14,26 -22,-8" fill="url(#gem1)" stroke="#7a5417" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="0" y2="26" stroke="#a9781f" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- duplication link (dashed arcane beam) -->
  <line x1="245" y1="190" x2="360" y2="190" stroke="#4de3d1" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <line x1="840" y1="190" x2="955" y2="190" stroke="#4de3d1" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Right magic circle with duplicated teal item -->
  <g transform="translate(1050,190)">
    <circle r="95" fill="none" stroke="#4de3d1" stroke-width="1.5" opacity="0.55"/>
    <circle r="78" fill="none" stroke="#4de3d1" stroke-width="1" opacity="0.35"/>
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="none" stroke="#7fe9dd" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="none" stroke="#4de3d1" stroke-width="1" opacity="0.4"/>
    <polygon points="0,-30 22,-8 14,26 -14,26 -22,-8" fill="url(#gem2)" stroke="#1c6d64" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="0" y2="26" stroke="#2a9d92" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- small floating rune particles -->
  <g fill="#ffd479" opacity="0.6">
    <circle cx="300" cy="120" r="3"/>
    <circle cx="330" cy="230" r="2.4"/>
    <circle cx="870" cy="100" r="2.6"/>
    <circle cx="900" cy="250" r="3"/>
  </g>
  <g fill="#4de3d1" opacity="0.5">
    <circle cx="320" cy="170" r="2"/>
    <circle cx="880" cy="180" r="2.2"/>
  </g>

  <!-- decorative ornate frame lines top/bottom center -->
  <path d="M470,55 Q600,35 730,55" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.5"/>
  <path d="M470,305 Q600,325 730,305" fill="none" stroke="url(#frameGrad)" stroke-width="2" opacity="0.5"/>

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="62" fill="#f5e6c8" letter-spacing="1">
    <tspan x="600" textLength="900" lengthAdjust="spacingAndGlyphs">Baldur's Gate 3 Item</tspan>
  </text>
  <text x="600" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="62" fill="#f5e6c8" letter-spacing="1">
    <tspan x="600" textLength="500" lengthAdjust="spacingAndGlyphs">Duplicator</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="275" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#c9b8e0">
    <tspan x="600" textLength="820" lengthAdjust="spacingAndGlyphs">Reads save files, processes item data, exports duplicated stacks — no setup</tspan>
  </text>
</svg>